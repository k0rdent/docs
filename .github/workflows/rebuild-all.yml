# .github/workflows/rebuild-all.yml

# Manual full rebuild. Collects main plus every release-v* branch and pushes each
# one through the same shared CI that a normal branch push would use.
#
# Order does not matter: shared-ci decides 'latest' from
# max(published versions + the one being built), so a leg for an older release
# never steals the aliases regardless of when it runs. The legs serialize
# themselves via shared-ci's `docs-deployment` concurrency group, which also
# keeps them from colliding with a push-triggered run.
name: Rebuild All Docs to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-branches:
    runs-on: ubuntu-latest

    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
      # A shallow checkout is enough; ls-remote queries the remote directly and
      # actions/checkout has already configured credentials for origin.
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Collect buildable branches
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          # Deliberately a loose glob. A malformed name like release-v-whoa-baby
          # is collected here and then fails its own leg loudly in shared-ci,
          # rather than being silently dropped from a full rebuild.
          BRANCHES="$(
            {
              echo main
              git ls-remote --heads origin 'release-v*' | sed 's#.*refs/heads/##'
            } |
            sed '/^$/d' |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
            '
          )"

          echo "Rebuilding: $BRANCHES"

          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  deploy:
    needs: find-branches

    strategy:
      # One bad branch fails its own leg without stopping the rest.
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.find-branches.outputs.branches) }}

    uses: k0rdent/docs/.github/workflows/shared-ci.yml@main

    with:
      branch: ${{ matrix.branch }}
